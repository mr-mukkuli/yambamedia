title: "Yamba Media"
description: "Creativity from a different perspective"
baseurl: ""  # Leave empty for custom domain
url: "https://yambamedia.com"  # Your actual domain

# Build settings
markdown: kramdown
permalink: pretty

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Exclude from processing
exclude:
  - admin/
  - "*.mp4"
  - "*.mov"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
