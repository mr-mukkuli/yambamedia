title: "Yamba Media"
description: "Creativity from a different perspective"
baseurl: ""
url: "https://yourdomain.com"  # Replace with your actual domain

# Build settings
markdown: kramdown
permalink: pretty

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:slug/

# Exclude from processing
exclude:
  - admin/
  - "*.mp4"
  - "*.mov"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
