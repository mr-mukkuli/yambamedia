title: "Yamba Media"
description: "Creativity from a different perspective"
baseurl: ""  # Leave empty for custom domain
url: "https://yambamedia.com"  # Your actual domain

# Build settings
markdown: kramdown
permalink: pretty

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Exclude from processing
exclude:
  - "*.mp4"
  - "*.mov"
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle

# Include these files in the build
include:
  - _redirects

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
