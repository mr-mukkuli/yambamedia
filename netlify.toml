[build]
  publish = "/"

# Disable all processing for static site
[build.environment]
  NETLIFY_VIDEO_PROCESSING = "false"

# Video headers
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.m4v"
  [headers.values]
    Content-Type = "video/mp4" 
    Cache-Control = "public, max-age=31536000"

# Admin redirect
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
