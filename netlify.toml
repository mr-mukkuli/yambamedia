[build]
  command = "bundle install && bundle exec jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.2.2"

# Redirect /blog.html to /blog/ for proper Jekyll routing
[[redirects]]
  from = "/blog.html"
  to = "/blog/"
  status = 301
  force = true

# Admin panel
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
